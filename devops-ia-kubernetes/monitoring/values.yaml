# VictoriaMetrics k8s stack — valores ajustados para t3.small (2 GiB RAM por node)
# Referência: ADR-0007

vmsingle:
  spec:
    retentionPeriod: "7d"
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    storage:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi

vmagent:
  spec:
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "300m"

grafana:
  enabled: true
  adminPassword: "devops-ia-2026"
  plugins:
    - victoriametrics-metrics-datasource
  grafana.ini:
    plugins:
      allow_loading_unsigned_plugins: victoriametrics-metrics-datasource
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "384Mi"
      cpu: "200m"

kube-state-metrics:
  resources:
    requests:
      memory: "32Mi"
      cpu: "10m"
    limits:
      memory: "128Mi"
      cpu: "100m"

prometheus-node-exporter:
  resources:
    requests:
      memory: "16Mi"
      cpu: "10m"
    limits:
      memory: "64Mi"
      cpu: "100m"

alertmanager:
  enabled: false

vmalert:
  enabled: false
